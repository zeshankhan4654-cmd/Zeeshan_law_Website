    <rect x="55" y="22" width="10" height="70" />
    <rect x="14" y="26" width="92" height="9" />
    <rect x="42" y="85" width="36" height="8" />
    <rect x="32" y="93" width="56" height="9" />
    <rect x="22" y="35" width="4" height="16" />
    <polygon points="6,51 42,51 31,71 17,71" />
    <rect x="94" y="35" width="4" height="16" />
    <polygon points="78,51 114,51 103,71 89,71" />
  </g>
</svg>
